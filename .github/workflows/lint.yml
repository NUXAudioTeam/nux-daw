name: Formatting and housekeeping

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: No build artefacts committed
        run: |
          if git ls-files | grep -E '^(build|out|cmake-build-.*)/'; then
            echo "::error::Build output must not be committed."
            exit 1
          fi
          echo "OK - no build output tracked."

      - name: No credentials committed
        run: |
          # Build the patterns piecewise so this file never matches itself.
          PAT='ghp_'"'"'[A-Za-z0-9]{20,}'
          PAT2='github_pat_'"'"'[A-Za-z0-9_]{20,}'
          PAT3='AKIA'"'"'[0-9A-Z]{16}'
          if git grep -nIE "$PAT|$PAT2|$PAT3" -- . ':!external' ; then
            echo "::error::A credential-looking string was found in the repository."
            exit 1
          fi
          echo "OK - no credentials found."

      - name: No stray build or secret files tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|secrets\.json|.*\.token)$'; then
            echo "::error::Secret files must never be tracked."
            exit 1
          fi
          echo "OK."

      - name: JUCE submodule is present
        run: |
          test -f external/JUCE/CMakeLists.txt || {
            echo "::error::external/JUCE is missing - commit the submodule pointer."
            exit 1
          }
          echo "JUCE present."

      - name: Source tree sanity
        run: |
          COUNT=$(find src -name '*.cpp' -o -name '*.h' | wc -l)
          echo "Source files: $COUNT"
          test "$COUNT" -gt 20 || { echo "::error::Unexpectedly few source files."; exit 1; }

      - name: CMake files parse
        run: |
          test -f CMakeLists.txt
          test -f tests/CMakeLists.txt
          echo "OK."
