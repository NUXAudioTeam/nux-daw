name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, Release)
    # windows-latest no longer guarantees a Visual Studio 2022 installation, and the
    # "Visual Studio 17 2022" generator needs one. Pin the image that ships VS 2022.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Report the toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath -format value
          } else {
            Write-Host "vswhere not found"
          }
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "JUCE: $(git -C external/JUCE describe --tags 2>$null)"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Confirm the ASIO backend was actually compiled in
        shell: pwsh
        run: |
          # JUCE_ASIO defaults to 0. This proves the CMake flag really reaches the
          # compiler on Windows - a Linux build cannot check this at all.
          $defines = & cmake --build build --config Release --target NUX --verbose 2>&1 |
                     Select-String -Pattern "JUCE_ASIO=1"
          $cache = Get-ChildItem -Path build -Recurse -Filter "*.rsp" -ErrorAction SilentlyContinue |
                   Select-String -Pattern "JUCE_ASIO=1"
          if ($defines -or $cache) {
            Write-Host "JUCE_ASIO=1 is present in the compile commands"
          } else {
            # The verbose build may be a no-op if nothing changed. Fall back to reading
            # the generated project files.
            $hits = Get-ChildItem -Path build -Recurse -Include "*.vcxproj","*.txt","*.ninja" -ErrorAction SilentlyContinue |
                    Select-String -Pattern "JUCE_ASIO" -SimpleMatch |
                    Select-Object -First 5
            if ($hits) {
              $hits | ForEach-Object { Write-Host $_.Line.Trim() }
              Write-Host "JUCE_ASIO appears in the generated build files"
            } else {
              throw "JUCE_ASIO does not appear anywhere in the build: ASIO is NOT compiled in."
            }
          }

      - name: Run the unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Report the audio device inventory on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          # A hosted runner has no sound card, but this shows what the Windows device
          # enumeration actually reports - useful for the test report.
          # A reporting flag must exit on its own. Belt and braces: the job used to hang
          # here forever when the app opened its window and idled, so the step now has
          # its own deadline and kills the process rather than burning the job timeout.
          $exe = "build/NUX_artefacts/Release/NUX DAW.exe"
          if (Test-Path $exe) {
            $out = Join-Path $env:RUNNER_TEMP "device-report.txt"
            $p = Start-Process -FilePath $exe -ArgumentList "--device-report" -PassThru `
                               -RedirectStandardOutput $out -RedirectStandardError "$out.err" -NoNewWindow
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              Write-Host "::warning::--device-report did not exit within 120 s and was killed."
            }
            # The app reports through std::cerr, not stdout, so both streams matter -
            # printing only the stdout file is how this step ran green while showing
            # nothing at all.
            if (Test-Path $out)     { Get-Content $out     | Write-Host }
            if (Test-Path "$out.err") { Get-Content "$out.err" | Write-Host }
          }

      - name: Publish the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-release
          path: |
            build/Testing/
            AUDIO_TEST_REPORT.md
          if-no-files-found: warn
          retention-days: 14

      - name: Check that the plugin hosting tests really ran
        shell: pwsh
        run: |
          # The plugin host tests need the VST3 test plugins. If they were not built
          # the tests skip, and this step makes that visible instead of quietly green.
          $plugins = Get-ChildItem -Path build -Recurse -Filter "NUX Test Gain.vst3" -ErrorAction SilentlyContinue
          if (-not $plugins) { throw "The VST3 test plugins were not built, so plugin hosting was not verified." }
          $plugins | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Check that the application binary exists
        shell: pwsh
        run: |
          $exe = "build/NUX_artefacts/Release/NUX DAW.exe"
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: NUX-DAW-windows-release
          path: build/NUX_artefacts/Release/
          if-no-files-found: error
          retention-days: 14

  windows-debug:
    name: Windows (MSVC, Debug + leak detector)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        run: cmake -S . -B build-debug -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-debug --config Debug --parallel

      - name: Run the unit tests
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Fail on leaked objects
        shell: pwsh
        run: |
          # JUCE's leak detector prints this only in Debug. A Release-only CI would
          # never catch a leak, which is how one survived in PluginRetirementQueue.
          $exe = Get-ChildItem -Path build-debug -Recurse -Filter "NUXTests.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "The test binary was not built." }
          $output = & $exe.FullName 2>&1 | Out-String
          Write-Host $output
          if ($output -match "Leaked objects detected") { throw "Memory leaks were detected." }
          if ($output -notmatch "All NUX tests passed") { throw "The test suite did not report success." }

  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run the unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Report the audio device inventory
        continue-on-error: true
        run: |
          # A CI runner has no sound card. This records what the engine actually sees,
          # which is exactly the situation AUDIO_TEST_REPORT.md describes.
          # Deadline for the same reason as on Windows: a reporting flag that idles
          # would otherwise hang the job until the global timeout.
          timeout 120 ./build/NUX_artefacts/Release/"NUX DAW" --device-report 2>&1 \
            || echo "::warning::the device report did not finish within 120 s"

      - name: Publish the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-release
          path: |
            build/Testing/
            AUDIO_TEST_REPORT.md
          if-no-files-found: warn
          retention-days: 14

      - name: Check that the plugin hosting tests really ran
        run: |
          # The host tests are only meaningful when the VST3 test plugins exist.
          find build -name "NUX Test Gain.vst3" -print -quit | grep .             || (echo "The VST3 test plugins were not built, so plugin hosting was not verified." && exit 1)
          find build -name "NUX Test Tone.vst3" -print -quit | grep .             || (echo "The VST3 instrument test plugin was not built." && exit 1)

  # ThreadSanitizer, on Linux only.
  #
  # Windows has no usable TSan, and the races that matter in this project are in portable
  # code: the audio thread against the UI thread, and the MIDI thread against both. This
  # job exists to keep the "publish, don't share" rule honest - a comment claiming a
  # lock-free handoff is worth nothing if nothing ever checks it.
  #
  # It is deliberately a separate job with the NUXTests target only. A TSan build is slow,
  # and it should never slow down the three jobs that gate the release.
  #
  # What this does NOT prove: TSan reports races it observes. A clean run means none were
  # observed on the paths this suite exercises, not that the program is race free.
  linux-tsan:
    name: Linux (GCC, ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # halt_on_error makes the process die on the first race rather than print and
      # carry on, and exitcode makes it a non-zero exit that fails the step.
      TSAN_OPTIONS: halt_on_error=1 exitcode=66 second_deadlock_stack=1

    steps:
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check that ThreadSanitizer is usable on this kernel
        run: |
          # Newer kernels use a wider mmap randomisation than TSan supports and it
          # aborts with "unexpected memory mapping". Narrowing it is the documented
          # workaround; if it is not permitted, say so instead of failing silently.
          sudo sysctl vm.mmap_rnd_bits=28 || echo "::warning::could not narrow vm.mmap_rnd_bits"
          cat << 'EOF' > /tmp/tsan-probe.cpp
          int main() { return 0; }
          EOF
          g++ -fsanitize=thread -g /tmp/tsan-probe.cpp -o /tmp/tsan-probe
          /tmp/tsan-probe && echo "TSan is usable"

      - name: Configure
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build the test runner
        run: cmake --build build-tsan --target NUXTests --parallel

      # The VST3 test plugins must exist, or PluginHostTests reports its "not built"
      # group and the hosting path is not exercised under TSan at all.
      - name: Build the VST3 test plugins
        run: cmake --build build-tsan --target NUXTestGain_VST3 NUXTestTone_VST3 --parallel

      - name: Run the suite under ThreadSanitizer
        run: |
          set -o pipefail
          # A race kills the process with exit code 66; a failed assertion fails the suite.
          # Either way this step fails, and it fails on purpose.
          ./build-tsan/tests/NUXTests_artefacts/Debug/NUXTests 2>&1 | tee /tmp/tsan-output.txt
          if ! grep -q "All NUX tests passed" /tmp/tsan-output.txt; then
            echo "::error::The suite did not report success under ThreadSanitizer."
            exit 1
          fi
          if grep -q "WARNING: ThreadSanitizer" /tmp/tsan-output.txt; then
            echo "::error::ThreadSanitizer reported a race."
            exit 1
          fi

      - name: Publish the ThreadSanitizer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-output
          path: /tmp/tsan-output.txt
          if-no-files-found: warn
          retention-days: 14

