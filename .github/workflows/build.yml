name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Report the toolchain
        run: |
          cmake --version
          where cl || echo "cl not on PATH yet (it will be set up by MSVC)"
          echo "JUCE tag: $(git -C external/JUCE describe --tags 2>$null)"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run the unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check that the application binary exists
        shell: pwsh
        run: |
          $exe = "build/NUX_artefacts/Release/NUX DAW.exe"
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: NUX-DAW-windows-release
          path: build/NUX_artefacts/Release/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run the unit tests
        run: ctest --test-dir build --output-on-failure
